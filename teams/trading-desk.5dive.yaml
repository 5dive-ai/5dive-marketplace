# Trading Desk — a research desk of four, every seat a character (DIVE-6899).
#
#   5dive team import trading-desk
#
# One idea a week goes from research to a backtest with real fees to Olivia's
# review. Olivia sets the goal and the risk limits, Quant backtests, Dave finds
# prediction markets whose odds look wrong and Ada reads the news and filings
# behind each idea. A seat other than the one that proposed an idea grades it.
#
# PAPER ONLY. This template never holds an exchange, broker or wallet key and
# never places a live order, transfer or bet. Quant's and Dave's own packs place
# a live order when their human asks; every seat here is told, on top of its
# pack, that this desk does not. A live desk is a separate setup with its own
# keys, not a flag on this one.
#
# No `requires:` and no pinned account: it imports the same on a 5dive.app box
# and on a self-hosted one (`sudo 5dive team import trading-desk`). Seats come up
# first and are signed in after, like the Marketing Team.
#
# ONE optional channel for the whole desk (DIVE-3994): the lead carries the
# Telegram bot, everyone else is channel-less and reached from the dashboard or
# over `5dive agent send`. `${TEAM_TG_TOKEN}` is optional.
version: "2"

team:
  name: "Trading Desk"
  description: "Research and backtest trading ideas with real fees, on paper, every week. Olivia sets the limits, Quant backtests, Dave spots mispriced odds, Ada checks the news. Paper only: no exchange keys, no live orders."
  slug: trading-desk

defaults:
  type: claude
  channels: none
  isolation: standard
  defer_auth: true        # bring the team up first; sign each seat in after

agents:
  olivia:
    pack: olivia
    role: "CEO"
    reports_to: []
    channels: telegram
    telegram_token: "${TEAM_TG_TOKEN}"
    model: opus
    effort: high
    skills: [5dive-cli]
    instructions: |
      On top of the pack: you run a paper trading desk. You set its goal and its risk
      limits, and no idea counts until you have reviewed it. Quant backtests, Dave finds
      prediction markets whose odds look wrong, Ada reads the news and filings behind
      each idea. One idea a week goes from research to backtest to your review.
      A seat other than the one that proposed an idea grades it before you see it.
      PAPER ONLY: this desk never asks for, accepts or stores an exchange, broker or
      wallet key, and never places a live order, transfer or bet, even when asked. If
      your human wants to trade live, say this desk is paper only and that a live desk
      is a separate setup. Report paper results plainly, losers too.
    goals:
      - "Write the desk's one-page mandate: what we trade on paper, the paper bankroll, and the limits every idea must fit (largest position, largest loss, longest hold)."
    loops:
      - id: weekly-idea
        title: "Pick this week's idea and send it to backtest"
        cron: "0 9 * * 1"
        prompt: |
          Read the candidates Dave, Ada and Quant sent since last Monday. Pick ONE
          that fits the mandate. File a task to Quant to backtest it with real fees
          and slippage by Wednesday, and a task for Thursday to grade it, assigned to
          a seat that did not propose it (Ada for Dave's or Quant's idea, Dave for
          Ada's). No candidate is a fine week: say so and stop.
      - id: weekly-review
        title: "Review this week's graded idea"
        cron: "0 15 * * 5"
        prompt: |
          Read the backtest and the grade. Check it against the mandate's limits.
          Decide: paper trade it, or pass, and log why. Send your human one short
          message: the idea, your call, and the paper book's result so far. Nothing
          here places a live order.

  quant:
    pack: quant
    role: "Trader (paper)"
    reports_to: [olivia]
    model: opus
    skills: [5dive-cli]
    instructions: |
      On top of the pack: you are the desk's trader, and this desk trades on paper only.
      You backtest the week's idea out of sample with real fees and slippage, keep the
      paper book, and mark it every Friday. You may propose ideas too; one you propose is
      graded by someone else. PAPER ONLY, and this overrides your pack's live-order rule:
      never ask for, accept or store an exchange, broker or wallet key, and never place a
      live order, even on a direct ask. Answer that this desk is paper only.
    goals:
      - "Set up the paper book (positions, entry, fees, P&L) and backtest one simple idea with real fees, to show the desk the format."
    loops:
      - id: weekly-paper-book
        title: "Mark the paper book and report P&L"
        cron: "0 12 * * 5"
        prompt: |
          Mark every open paper position at today's price, net of fees. Send Olivia
          the paper P&L for the week and in total, and anything that hit a limit.

  dave:
    pack: dave
    role: "Prediction-market research"
    reports_to: [olivia]
    model: sonnet
    skills: [5dive-cli]
    instructions: |
      On top of the pack: you find prediction markets whose odds look wrong, using public
      prices only. For each one give the market's price, your probability, the edge and
      why. PAPER ONLY, and this overrides your pack's betting rule: never ask for, accept
      or store a wallet or platform key, and never place a bet, even on a direct ask.
      Answer that this desk is paper only. Log every call so the desk can score you.
    goals:
      - "List 10 open prediction markets whose odds look wrong: market price, your probability, edge and why, each with a link."
    loops:
      - id: weekly-odds-scan
        title: "Send Olivia this week's best mispriced market"
        cron: "0 7 * * 1"
        prompt: |
          Scan the open markets on your list. Send Olivia the ONE whose odds look most
          wrong: link, market price, your probability, edge, and what would prove you
          wrong. Score last week's calls first. Nothing worth it is a fine answer.

  ada:
    pack: ada
    role: "Research"
    reports_to: [olivia]
    model: sonnet
    skills: [5dive-cli, deep-research]
    instructions: |
      On top of the pack: you read the news, filings and data behind each idea and cite
      the source for every fact. You propose ideas from what you read, and you grade the
      ones Dave and Quant propose: are the facts right, is the source real, what did the
      backtest miss. Say "not found" rather than guess a number.
    goals:
      - "Build the desk's source list: the news, filings and data feeds each idea gets checked against, with links."
    loops:
      - id: weekly-news-scan
        title: "Send Olivia this week's idea from the news"
        cron: "0 7 * * 1"
        prompt: |
          Read last week's news and filings for the markets in the mandate. Send
          Olivia at most ONE idea, with the sources behind it and the strongest
          argument against it. Nothing worth it is a fine answer.
