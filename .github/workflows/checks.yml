# A check that EXISTS is not a check that FIRES.
#
# `scripts/build-cards.mjs --check` was written with a RED anchor and a mutation test,
# and then nothing ran it. That is the same shape as the defect it was written to
# close: the `**Skills:**` convention held on author discipline across 19 packs until
# it quietly did not, and 7 of the 8 oldest cards had already drifted before anyone
# looked. A convention with no enforcer decays on exactly the packs nobody rechecks.
#
# Deliberately NO `npm install` in this job. build-cards.mjs imports only node:fs,
# node:path and node:url — verified by deleting node_modules and re-running clean.
# Dependency-free is what keeps this gate deterministic, so please do not add an
# install step "for consistency": the repo's other check (`check:index`) pulls
# @5dive/openagent from a git ref, and coupling a content assertion to a network
# fetch is how a gate becomes flaky and then becomes ignored.
#
# Keep `check:index` in its own job. Unlike the dependency-free content assertions,
# it installs @5dive/openagent from a git ref before checking the computed index.
# A network failure there must not prevent the deterministic jobs from reporting.
#
# `voices` reads persona.yaml with openagent's yaml package, so it installs like
# `index` and sits in its own job for the same reason (DIVE-5452).
#
# `portraits` is the same shape as `check:index`, so it is also its own job: OpenCV is a
# pip install (pinned, since the face detector's numbers are the assertion), and a PyPI
# failure there must not stop the dependency-free jobs from reporting (DIVE-5188).

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  index:
    name: computed index matches pack personas and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install index dependencies
        run: npm install
      - name: build-index --check
        run: npm run check:index

  voices:
    name: every pack has its own voice (no silent Kore fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install openagent (for its yaml parser)
        run: npm install
      - name: check-voices
        run: npm run check:voices
      # Planted defects (cue without voice.audio, base unset, a typo, two teammates
      # on one voice) must each be refused, or the check above proves nothing.
      - name: check-voices mutation arms
        run: bash scripts/test-check-voices.sh
      # Each committed voice-sample.mp3 must have been rendered from the pack's
      # CURRENT base, style and sample line (DIVE-5649). Hash compare only; CI never
      # calls TTS. The arms plant a style change with no re-render (must red) and a
      # re-render (must go green again).
      - name: voice samples are current
        run: npm run check:voice-samples
      - name: voice-samples mutation arms
        run: bash scripts/test-voice-samples.sh

  cards:
    name: card Skills lines match their manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build-cards --check
        run: node scripts/build-cards.mjs --check

  skills:
    name: every manifest hero skill is actually bundled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Also dependency-free (node:fs/path/url/os only) — same reasoning as the
      # cards job above, no install step.
      - name: check-skills audit
        run: node scripts/check-skills.mjs
      - name: check-skills unit tests
        run: bash scripts/test-check-skills.sh

  teams:
    name: team templates match their index, and their skills exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dependency-free (bash + jq + gh, all preinstalled on the runner) — same
      # reasoning as the cards and skills jobs above, so no install step.
      #
      # DIVE-4196 wired this. Until it existed, teams/ had two committed checkers
      # and no job running them, which is the exact shape this file's own header
      # warns about: a check that EXISTS is not a check that FIRES. It matters
      # here because the CLI and the dashboard now read teams/index.json LIVE, so
      # a bad publish reaches customers with no release cut in front of it.
      - name: check-teams (index, paths, schemaVersion and rosters agree)
        run: npm run check:teams
      # Reads 5dive-ai/skills (public) cross-repo, so it needs a token in the
      # environment. It exits 2 — deliberately NOT a pass — when it cannot read
      # the skill list, so an unreadable check reds the job instead of going green.
      - name: check-team-skills (every template skill reference resolves)
        run: npm run check:team-skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  portraits:
    name: every pack avatar meets PORTRAITS.md framing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install OpenCV (pinned)
        run: python -m pip install "opencv-python-headless==4.14.0.94"
      # Every avatar, not only the ones a PR touches: 30 images take seconds, and a
      # whole-set run is what makes the Known exceptions list in PORTRAITS.md a
      # ratchet (a listed face that starts passing reds the job until it is removed).
      - name: check-portraits
        run: python scripts/check-portraits.py packs/*/avatar.png
      # The constructor's face library (DIVE-5873): same framing rule, and index.json must
      # list exactly the files on disk, since the API serves the ids it reads there.
      - name: check-portraits (faces/)
        run: python scripts/check-portraits.py faces/*.png
      - name: faces/index.json matches faces/*.png
        run: |
          python - <<'PY'
          import json, os, sys
          ids = [f["id"] for f in json.load(open("faces/index.json"))["faces"]]
          files = sorted(f[:-4] for f in os.listdir("faces") if f.endswith(".png"))
          bad = sorted(set(ids) ^ set(files)) + [i for i in set(ids) if ids.count(i) > 1]
          print(f"{len(ids)} indexed, {len(files)} files"); sys.exit(f"mismatch: {bad}" if bad else 0)
          PY
      # The mutation arms: planted off-ratio, off-centre, non-square, tiny and
      # faceless avatars must each be refused, or the check above proves nothing.
      - name: check-portraits mutation arms
        run: PY=python bash scripts/test-check-portraits.sh
